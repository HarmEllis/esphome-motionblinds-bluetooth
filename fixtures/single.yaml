# A single (non top-down bottom-up) Motionblinds motor.
#
#   esphome config fixtures/single.yaml

esphome:
  name: motionblinds-single

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:

wifi:
  ssid: fixture
  password: fixture-password

external_components:
  - source:
      type: local
      path: ../esphome/components
    components: [motionblinds_ble]

time:
  - platform: sntp
    id: local_time

esp32_ble:
  max_connections: 1

esp32_ble_tracker:

motionblinds_ble:
  - id: office_blind
    mac_address: A4:C1:38:00:12:34
    time_id: local_time
    blind_type: roller

cover:
  - platform: motionblinds_ble
    motionblinds_ble_id: office_blind
    name: "Office blind"
