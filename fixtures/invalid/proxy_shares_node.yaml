# Must fail: six motors already use every BLE client registration, so a
# Bluetooth proxy cannot share the node. Without this check it builds fine and
# fails on the ESP during GATT app registration.
esphome:
  name: invalid-proxy

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
api:

wifi:
  ssid: fixture
  password: fixture-password

external_components:
  - source:
      type: local
      path: ../../esphome/components
    components: [motionblinds_ble]

time:
  - platform: sntp
    id: local_time

esp32_ble:
  max_connections: 6

esp32_ble_tracker:

bluetooth_proxy:
  active: true

motionblinds_ble:
  - {id: m1, mac_address: A4:C1:38:00:00:01, time_id: local_time}
  - {id: m2, mac_address: A4:C1:38:00:00:02, time_id: local_time}
  - {id: m3, mac_address: A4:C1:38:00:00:03, time_id: local_time}
  - {id: m4, mac_address: A4:C1:38:00:00:04, time_id: local_time}
  - {id: m5, mac_address: A4:C1:38:00:00:05, time_id: local_time}
  - {id: m6, mac_address: A4:C1:38:00:00:06, time_id: local_time}
