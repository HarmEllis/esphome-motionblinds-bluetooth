# A top-down bottom-up blind with the fabric strung between the two rails,
# which is the common pleated (plisse) construction.
#
#   esphome config fixtures/tdbu_between_rails.yaml

esphome:
  name: motionblinds-tdbu

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
api:

wifi:
  ssid: fixture
  password: fixture-password

external_components:
  - source:
      type: local
      path: ../esphome/components
    components: [motionblinds_ble, motionblinds_ble_tdbu]

time:
  - platform: sntp
    id: local_time

esp32_ble:
  max_connections: 2

esp32_ble_tracker:
  scan_parameters:
    continuous: true
    connection_scan_window: 160ms

motionblinds_ble:
  # Identified by the code the motor advertises as MOTION_0A5A, rather than by
  # a full address. The address is learned from the first matching
  # advertisement.
  - id: living_top
    mac_code: 0A5A
    time_id: local_time
    blind_type: honeycomb
    # Leave fast_connect at its default false in this fixture so CI compiles
    # the conservative handshake as well as the quick-start's fast path.
    low_latency_connection: true
  - id: living_bottom
    mac_code: EBAA
    time_id: local_time
    blind_type: honeycomb
    # This rail is mounted upside down, so its raw positions run the other way
    # through the window.
    invert: true

motionblinds_ble_tdbu:
  - id: living_blind
    top_motor: living_top
    bottom_motor: living_bottom
    fabric: between_rails
    min_gap: 5%
    safety_margin: 2%
    # Nothing but this component moves this blind, so the remembered positions
    # can be trusted and a move does not have to wait for both motors first.
    optimistic: true
    preconnect_trailing: true
    prepare_timeout: 120s
    # Builds battery, signal, connection, position freshness and a refresh
    # button for both rails.
    diagnostics:
      name: "Living blind"

cover:
  - platform: motionblinds_ble_tdbu
    tdbu_id: living_blind
    rail: combined
    name: "Living blind"
  - platform: motionblinds_ble_tdbu
    tdbu_id: living_blind
    rail: top
    name: "Living blind top"
  - platform: motionblinds_ble_tdbu
    tdbu_id: living_blind
    rail: bottom
    name: "Living blind bottom"

number:
  - platform: motionblinds_ble_tdbu
    tdbu_id: living_blind
    fabric_position:
      name: "Living blind fabric position"
